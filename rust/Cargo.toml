[package]
name = "logtail"
version = "0.1.0"
edition = "2021"
description = "A live log tailer with built-in filtering: follow a file like tail -f, keep only the lines that match."

[[bin]]
name = "logtail"
path = "src/main.rs"

[lib]
name = "logtail"
path = "src/lib.rs"

[dependencies]
regex = "1"
chrono = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"
